name: Bug report
description: The CLI, a skill or the site did something wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem, don't open an issue: follow [SECURITY.md](https://github.com/sananthanarayan/skilldrop/blob/main/SECURITY.md) instead.
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - CLI (npx skilldrop-cli)
        - A skill's output
        - A loop
        - Claude Code plugin
        - The website or docs
    validations:
      required: true
  - type: input
    id: what
    attributes:
      label: Skill, loop or command
      placeholder: "e.g. doc-critique, or: skilldrop update --project"
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what you expected
      description: Paste the command and its output, or the prompt and the part of the response that's wrong.
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Versions
      description: "`npx skilldrop-cli --version` or the version in the skill's manifest.json, plus your tool (Claude Code, Cursor, Kiro, Codex, Copilot…) and OS"
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: skilldrop doctor output (for install problems)
      render: text
