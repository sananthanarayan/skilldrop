# Two ecosystems, one reason: everything here is pinned exactly, and exact pins go stale
# silently. This is the other half of that trade — a PR when a pin has a newer release.
#
# github-actions: pinned to commit SHAs, so a repointed tag cannot inject code into the
# publish job. Dependabot keeps the SHA and its trailing version comment honest.
#
# pip: the two skills with scripts pin their deps rather than ranging, so a future release
# cannot install itself unreviewed onto a user's machine. Note these installs happen on the
# *user's* machine, not in CI — a merged bump only reaches people who reinstall the skill.
#
# npm: only for .github/tools, the hash-locked build tools CI installs (pagefind). The
# published package has zero dependencies, so it needs no npm updates of its own.
#
# Eval fixtures hold no live dependency files: a fake project's package.json, go.mod or
# Dockerfile is stored as package.json.fixture, so the dependency graph never reads its pins as ours
# (RFC-0058; validate.py enforces it, run_bench.py restores the name for a run).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /packs/design/skills/deck-builder
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies

  # Watch only. A major bump here can raise the Python floor, which is a breaking change
  # for anyone on an older interpreter — review the release notes before merging.
  - package-ecosystem: pip
    directory: /packs/solution-architect/skills/figma-diagrams
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies

  # CI's own tools, locked by hash (.github/tools): pagefind for the site, zizmor for the
  # workflow audit, Atheris for fuzzing (requirements-fuzz.txt). Dependabot rewrites the version
  # and the hashes together.
  - package-ecosystem: npm
    directory: /.github/tools
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies

  - package-ecosystem: pip
    directory: /.github/tools
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
