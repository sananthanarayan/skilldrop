# Two ecosystems, one reason: everything here is pinned exactly, and exact pins go stale
# silently. This is the other half of that trade — a PR when a pin has a newer release.
#
# github-actions: pinned to commit SHAs, so a repointed tag cannot inject code into the
# publish job. Dependabot keeps the SHA and its trailing version comment honest.
#
# pip: the two skills with scripts pin their deps rather than ranging, so a future release
# cannot install itself unreviewed onto a user's machine. Note these installs happen on the
# *user's* machine, not in CI — a merged bump only reaches people who reinstall the skill.
#
# No npm ecosystem: the package has zero dependencies.
#
# Security updates ignore this file. Package manifests under packs/*/skills/*/evals/files/ are
# fixtures: an agent under test reads them as data, and nothing installs or runs them. Their
# old versions are part of the scenario (the stats files and assertions are written for them),
# so a security PR against one is closed and its alert dismissed as "not used", not merged.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /packs/design/skills/deck-builder
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies

  # Watch only. A major bump here can raise the Python floor, which is a breaking change
  # for anyone on an older interpreter — review the release notes before merging.
  - package-ecosystem: pip
    directory: /packs/solution-architect/skills/figma-diagrams
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
