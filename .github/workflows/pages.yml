# Build the catalogue site on every push/PR; deploy to GitHub Pages on main.
# Deliberately separate from release.yml so a site change can never touch the npm
# publish path. Requires a one-time repo setting: Settings -> Pages -> Source:
# "GitHub Actions". See RFC-0011.
name: pages

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Guard marketplace against drift
        run: python3 build_marketplace.py --check
      - name: Generate the catalogue
        run: python3 build_site.py # stdlib only — no setup-python step needed
      - name: Generate the docs portal
        run: python3 build_docs.py # stdlib only — walks guides/, renders markdown, writes build/docs/
      - name: Generate the catalogue page
        run: python3 build_catalogue.py # stdlib only — writes build/catalogue/index.html
      - name: Fetch the eval history
        # Counts-only summaries the evals workflow appends to the eval-history branch (RFC-0055).
        # The branch may not exist yet (no API key, or no run so far); the page then says so.
        run: |
          set -euo pipefail
          mkdir -p .eval-history
          if git fetch --depth=1 "https://github.com/${GITHUB_REPOSITORY}.git" eval-history 2>/dev/null; then
            git archive FETCH_HEAD runs 2>/dev/null | tar -x -C .eval-history || true
          fi
          echo "eval runs: $(find .eval-history -name '*.json' -type f | wc -l)"
      - name: Generate the pack, skill and changelog pages
        run: python3 build_pages.py # stdlib only — writes build/packs/, build/skills/, build/changelog/
      - name: Index the built site for full-text search
        # Pagefind reads the HTML and writes build/pagefind/, which the nav's search dialog loads.
        # A build-time tool only: nothing is added to package.json or the published package, and
        # the version is pinned. The site still searches names and summaries without it.
        run: npx --yes pagefind@1.5.2 --site build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./build

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
