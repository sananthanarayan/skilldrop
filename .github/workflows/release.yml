# Lint on every push/PR; publish to npm when the package.json version is new, and to PyPI
# as well once the repository variable PYPI_PUBLISH is "true" (see the pypi job).
# Auth: npm OIDC trusted publishing (no token) — one-time setup on npmjs.com:
# package skilldrop-cli -> Settings -> Trusted Publisher -> GitHub Actions,
# repository sananthanarayan/skilldrop, workflow release.yml, environment release. See RFC-0004.
#
# Both publish jobs run in the GitHub environment `release`, which only the main branch may
# use, and both registries are told to require it. The registries otherwise check only the
# repository and this file's name, so an edited copy of this file on another branch could
# publish. With the environment it cannot: GitHub will not start the job off main, and a run
# without the environment is refused by npm and PyPI.
name: release

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default: the lint job needs nothing but a checkout. The publish
# job re-grants exactly what it needs. Without this the lint job inherits the repo-wide
# default token scopes, which is more than it should ever hold.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Repo consistency lint
        run: python3 validate.py
      - name: Catalog structural check
        run: node bin/skilldrop.js validate

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: lint
    runs-on: ubuntu-latest
    environment: release # only main may use it; the registry rejects a publish from outside it
    permissions:
      id-token: write # OIDC trusted publishing + --provenance
      contents: write # push the v<version> tag after a successful publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1  # zizmor: ignore[artipacked] this job pushes with the job token, so it keeps credentials
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24 # ships an OIDC-capable npm 11.x natively
          registry-url: https://registry.npmjs.org
      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: npm install -g npm@11.21.0 && npm --version  # zizmor: ignore[adhoc-packages] pinned exact version; a global CLI install has no lockfile
      - name: Publish if version is new
        run: |
          set -o pipefail  # the publish below is piped through tee; its exit code must survive
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view skilldrop-cli version 2>/dev/null || echo none)
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "skilldrop-cli@$LOCAL already on the registry — nothing to publish"
            exit 0
          fi
          # npm stages CI publishes until a maintainer approves them with 2FA, and a staged
          # version is invisible to `npm view`. The v<version> tag is pushed only after a
          # publish succeeds, so it is the record that this version already went up.
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$LOCAL")" ]; then
            echo "::notice title=skilldrop-cli@$LOCAL awaiting approval::v$LOCAL is tagged but the registry shows $PUBLISHED. It is staged on npm: approve it with 'npm stage list skilldrop-cli' then 'npm stage approve <id>'."
            exit 0
          fi
          echo "publishing skilldrop-cli@$LOCAL (registry has $PUBLISHED)"
          if ! npm publish --provenance 2>&1 | tee /tmp/publish.log; then
            if grep -q "previously staged version" /tmp/publish.log; then
              echo "::notice title=skilldrop-cli@$LOCAL already staged::approve it with 'npm stage approve <id>'."
            else
              exit 1
            fi
          fi
          if grep -qi "staged" /tmp/publish.log; then
            echo "::notice title=skilldrop-cli@$LOCAL staged::npm is holding this version until a maintainer approves it with 2FA: 'npm stage list skilldrop-cli', then 'npm stage approve <id>'."
          fi
          if git rev-parse "v$LOCAL" >/dev/null 2>&1; then
            echo "tag v$LOCAL already exists — skipping"
          else
            git tag "v$LOCAL"
            git push origin "v$LOCAL"
            echo "tagged v$LOCAL"
          fi

          # A tag is a pointer; a Release is the page people actually read. Cut one from the
          # same commit, using its message body as the notes — commit messages here are already
          # written as changelog entries, so there is nothing to duplicate or let drift.
          if gh release view "v$LOCAL" >/dev/null 2>&1; then
            echo "release v$LOCAL already exists — skipping"
          else
            {
              git log -1 --pretty=%b | sed '/^Co-Authored-By:/d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}'
              echo
              echo "---"
              echo
              echo "\`\`\`bash"
              echo "npx skilldrop-cli@$LOCAL install --pack solution-architect"
              echo "\`\`\`"
              echo
              echo "[skilldrop-cli@$LOCAL on npm](https://www.npmjs.com/package/skilldrop-cli/v/$LOCAL) — published with provenance."
            } > /tmp/notes.md
            gh release create "v$LOCAL" \
              --title "v$LOCAL — $(git log -1 --pretty=%s | sed 's/ (\?[0-9]\+\.[0-9]\+\.[0-9]\+)\?$//')" \
              --notes-file /tmp/notes.md \
              --verify-tag
            echo "released v$LOCAL"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The same files as a PyPI wheel, so `pipx install skilldrop-cli` works. Auth is PyPI trusted
  # publishing (OIDC, no token), set up once on pypi.org: project skilldrop-cli -> Publishing ->
  # add a GitHub publisher with owner sananthanarayan, repository skilldrop, workflow release.yml,
  # and environment release. Until that exists an upload would fail, so the job waits on the repository
  # variable PYPI_PUBLISH: set it to "true" (Settings -> Secrets and variables -> Actions ->
  # Variables) once the publisher is registered. See packaging/README.md.
  pypi:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PYPI_PUBLISH == 'true'
    needs: lint
    runs-on: ubuntu-latest
    environment: release # only main may use it; PyPI rejects a publish from outside it
    permissions:
      id-token: write # OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is this version new on PyPI?
        id: check
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          CODE=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/skilldrop-cli/$VERSION/json")
          if [ "$CODE" = "200" ]; then
            echo "skilldrop-cli $VERSION is already on PyPI — nothing to publish"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "publishing skilldrop-cli $VERSION to PyPI (lookup returned $CODE)"
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the wheel and sdist
        if: steps.check.outputs.new == 'true'
        run: |
          python3 -m pip install --quiet --user "build==1.6.1"  # zizmor: ignore[adhoc-packages] exact version pin
          python3 packaging/pypi/build_wheel.py
      - name: Publish to PyPI
        if: steps.check.outputs.new == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
