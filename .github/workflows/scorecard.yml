# OpenSSF Scorecard: an outside, repeatable score of this repo's supply-chain practices, run on
# main weekly and after every merge. Results go to the Security tab as code scanning alerts and
# to the public Scorecard API, which serves the README badge. RFC-0059.
#
# With publish_results, the Scorecard API only accepts a run from a workflow that does nothing
# else: no top-level env or defaults, no extra steps beyond checkout, scorecard, upload.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write # sign the published result, so the badge can't be forged
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7
      - uses: github/codeql-action/upload-sarif@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          sarif_file: results.sarif
