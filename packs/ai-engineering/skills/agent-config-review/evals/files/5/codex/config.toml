# Harrow Freight platform team - shared Codex config
# Installed as ~/.codex/config.toml on dev laptops and on the harrow-runner CI hosts.
# Owner: platform-tools. Change via PR to platform/dotfiles.

profile = "dev"

approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = true
# docker compose in `make test` needs the socket (HF-412)
writable_roots = ["/var/run/docker.sock", "/home/runner/.cache"]

[shell_environment_policy]
inherit = "all"

[mcp_servers.github]
command = "github-mcp-server"
args = ["stdio"]
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "ghp_EXAMPLEEXAMPLEEXAMPLE" }

[profiles.dev]
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[profiles.review]
approval_policy = "untrusted"
sandbox_mode = "read-only"

[profiles.ci]
# Unattended: nobody is there to approve, so never ask.
approval_policy = "never"
sandbox_mode = "workspace-write"
