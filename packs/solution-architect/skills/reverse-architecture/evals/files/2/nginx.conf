server {
    listen 443 ssl;
    server_name tickets.gildedlantern.example.test;

    ssl_certificate     /etc/nginx/certs/site.crt;
    ssl_certificate_key /etc/nginx/certs/site.key;

    location / {
        proxy_pass http://web:8000;
    }

    location /admin/ {
        proxy_pass http://admin:8080;
    }
}
