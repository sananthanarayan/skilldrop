name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: example-only
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgres://postgres:example-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run gen:types && git diff --exit-code src/generated
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --coverage
