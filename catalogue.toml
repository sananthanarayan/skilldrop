# Generated by build_catalogue.py — do not edit. Source of truth is skilldrop's
# flat skills/ + packs.json; this is the agentbundle-schema export (RFC-0014).
schema = 1

[catalogue]
name = "skilldrop"
display-name = "skilldrop"
description = "Portable AI-agent skills for the deliverables knowledge workers ship — diagrams, ADRs, PRDs, runbooks, decks, reviews — installable into Claude Code, Cursor, Kiro, and any IDE that takes custom instructions. One command per skill or per role-based pack."
minimum-agentbundle-version = "0.13.0"

[catalogue.paths]
packs = "packs"
profiles = "profiles"
contracts = "contracts"
marketplace = ".claude-plugin/marketplace.json"
build-output = "dist"

[catalogue.build]
recipes = ["default"]
self-host = false
claude-plugin-branch = "main"
marketplace-description = "skilldrop — portable AI-agent skills, as agentbundle packs."

[catalogue.package]
include = ["packs/solution-architect", "packs/product-manager", "packs/dev-team", "packs/sre-oncall", "packs/stakeholder-comms", "packs/ai-engineering"]

[distribution.agentbundle]
install-defaults-output = "install-defaults.toml"
preferred-adapter = "claude-code"
default-source = "git+https://github.com/sananthanarayan/skilldrop@agentbundle-catalogue"

[distribution.agentbundle.artifactory]
enabled = false
